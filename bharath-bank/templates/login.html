{% extends "base.html" %}
{% block title %}Login · {{ BANK_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h2>Internet Banking Login</h2>
    <div class="sub">Welcome back to {{ BANK_NAME }}.</div>
    <form method="post">
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autofocus>
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-navy btn-block" type="submit">Log In</button>
    </form>
    <div class="form-foot">New to {{ BANK_SHORT }}? <a href="{{ url_for('register') }}">Open an account</a></div>
  </div>
</div>
{% endblock %}
